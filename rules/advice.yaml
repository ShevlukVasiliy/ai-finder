      title: "Текст слишком ровный по структуре"
      explain: "Одинаковые предложения, одинаковые абзацы и шаблонная композиция: {members}."
      actions:
        - "Перестройте текст: начните с примера, сделайте один абзац коротким, а другой длинным."
        - "Смешайте короткие и длинные предложения и уберите итоговый абзац."
    en:
      title: "The text is structurally too even"
      explain: "Uniform sentences, uniform paragraphs and a template layout: {members}."
      actions:
        - "Restructure: open with an example, make one paragraph short and another long."
        - "Mix short and long sentences, drop the summary paragraph."
