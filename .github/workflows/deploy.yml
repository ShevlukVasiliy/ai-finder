name: Deploy

# Runs after a green CI on main and publishes the static build to GitHub Pages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # SPA fallback: GitHub Pages serves 404.html for unknown paths.
          cp dist/index.html dist/404.html
          echo "${{ github.event.workflow_run.head_sha || github.sha }}" > dist/release.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Smoke test
        working-directory: frontend
        env:
          E2E_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMOKE: '1'
        run: |
          set -e
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          for i in $(seq 1 30); do [ "$(curl -s "${E2E_BASE_URL}release.txt")" = "$SHA" ] && break; sleep 10; done
          test "$(curl -s "${E2E_BASE_URL}release.txt")" = "$SHA"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/smoke.spec.ts --project desktop
