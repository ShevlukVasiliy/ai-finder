name: Deploy

# Runs after a green CI on main. The build goes to a private Object Storage bucket served by API Gateway.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  S3: aws s3 --endpoint-url https://storage.yandexcloud.net
  BUCKET: ${{ vars.SITE_BUCKET }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Remember the currently deployed release (for rollback)
        id: prev
        run: |
          prev=$($S3 cp s3://$BUCKET/release.txt - 2>/dev/null || true)
          echo "sha=$prev" >> "$GITHUB_OUTPUT"

      - name: Upload release snapshot
        run: |
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          echo "$SHA" > frontend/dist/release.txt
          $S3 sync frontend/dist "s3://$BUCKET/releases/$SHA/" --delete --only-show-errors

      - name: Publish
        run: |
          # Hashed assets first (long cache), then HTML/entry files (no cache) so clients never see a broken mix.
          $S3 sync frontend/dist "s3://$BUCKET/" --exclude "releases/*" --exclude "*.html" --exclude "release.txt" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
          $S3 sync frontend/dist "s3://$BUCKET/" --exclude "*" --include "*.html" --include "release.txt" \
            --cache-control "no-cache" --only-show-errors
          $S3 sync frontend/dist "s3://$BUCKET/" --exclude "releases/*" --delete --only-show-errors

      - name: Smoke test
        id: smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.SITE_URL }}
          SMOKE: '1'
        run: |
          set -e
          for p in / /release.txt $(curl -s "$SITE_URL/" | grep -o '/assets/[^"]*'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$p")
            echo "$p → $code"; test "$code" = 200
          done
          test "$(curl -s "$SITE_URL/release.txt")" = "${{ github.event.workflow_run.head_sha || github.sha }}"
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/smoke.spec.ts --project desktop

      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.sha != ''
        run: |
          PREV=${{ steps.prev.outputs.sha }}
          echo "Rolling back to $PREV"
          $S3 sync "s3://$BUCKET/releases/$PREV/" "s3://$BUCKET/" --exclude "releases/*" --delete --only-show-errors
